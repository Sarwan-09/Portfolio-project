name: Trivy

on:
  pull_request: {}
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  trivy:
    name: trivy/fs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          # Free, open-source scanner. No account or token required.
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          # Fail the PR check when issues are found.
          exit-code: "1"
          format: table
